name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build static release binary
    runs-on: ubuntu-latest
    container:
      image: benz0li/ghc-musl:9.4.8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: apk add --no-cache postgresql16-dev openssl-libs-static zlib-static

      - name: Update package index
        run: cabal update

      - name: Test
        run: cabal test all --project-file=cabal.project.ci

      - name: Build static executable
        run: |
          cabal build exe:hauth \
            --enable-executable-static \
            --ghc-options="-optl-static -optl-pthread -optl-L/usr/lib"

      - name: Verify static
        run: |
          set -euo pipefail
          bin=$(cabal list-bin exe:hauth)
          file "$bin"
          file "$bin" | grep -q "statically linked"
          ldd "$bin" 2>&1 | grep -q "not a dynamic executable"
          "$bin" --help > /dev/null

      - name: Strip and package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          target="hauth-${tag}-linux-x86_64"
          mkdir -p dist/release
          cp "$(cabal list-bin exe:hauth)" "dist/release/${target}"
          strip "dist/release/${target}"
          chmod +x "dist/release/${target}"
          tar -C dist/release -czf "dist/release/${target}.tar.gz" "${target}"
          cd dist/release
          sha256sum "${target}.tar.gz" > "${target}.tar.gz.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.tar.gz
            dist/release/*.sha256
