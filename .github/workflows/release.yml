name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build static release binary
    runs-on: ubuntu-latest
    container:
      image: benz0li/ghc-musl:9.4.8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: apk add --no-cache postgresql16-dev openssl-libs-static zlib-static

      - name: Update package index
        run: cabal update

      - name: Build static executable
        # -l flags: libpq.a depends on libpgcommon.a/libpgport.a (portability helpers, not bundled) and pulls in OpenSSL for SCRAM/TLS. -optl-no-pie is needed because Alpine's gcc defaults to PIE, incompatible with -optl-static. --disable-shared forces cabal to build vanilla .a archives for every Haskell dep.
        run: |
          cabal build exe:hauth \
            --enable-executable-static \
            --enable-library-vanilla \
            --disable-shared \
            --disable-executable-dynamic \
            --ghc-options="-optl-static -optl-pthread -optl-no-pie -optl-L/usr/lib -optl-lpgcommon -optl-lpgport -optl-lssl -optl-lcrypto"

      - name: Verify static
        # `file` is authoritative — it directly reads the ELF and reports the linkage. Skipping `ldd` because Alpine musl ldd doesn't print "not a dynamic executable" the way glibc does.
        run: |
          set -euo pipefail
          bin=$(cabal list-bin exe:hauth)
          file "$bin"
          file "$bin" | grep -q "statically linked"
          "$bin" --help > /dev/null

      - name: Strip and package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          target="hauth-${tag}-linux-x86_64"
          mkdir -p dist/release
          cp "$(cabal list-bin exe:hauth)" "dist/release/${target}"
          strip "dist/release/${target}"
          chmod +x "dist/release/${target}"
          tar -C dist/release -czf "dist/release/${target}.tar.gz" "${target}"
          cd dist/release
          sha256sum "${target}.tar.gz" > "${target}.tar.gz.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.tar.gz
            dist/release/*.sha256
