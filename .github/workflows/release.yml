name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build release binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haskell
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.4.8"
          cabal-version: "3.12.1.0"

      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Cache cabal store and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc9.4.8-${{ hashFiles('**/*.cabal', 'cabal.project', 'cabal.project.ci') }}
          restore-keys: |
            ${{ runner.os }}-ghc9.4.8-

      - name: Update package index
        run: cabal update

      - name: Test
        run: cabal test all --project-file=cabal.project.ci

      - name: Build executable
        run: cabal build exe:hauth

      - name: Package executable
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          target="hauth-${tag}-linux-x86_64"
          mkdir -p dist/release
          cp "$(cabal list-bin exe:hauth)" "dist/release/${target}"
          chmod +x "dist/release/${target}"
          tar -C dist/release -czf "dist/release/${target}.tar.gz" "${target}"
          cd dist/release
          sha256sum "${target}.tar.gz" > "${target}.tar.gz.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.tar.gz
            dist/release/*.sha256
