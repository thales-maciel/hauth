name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build release binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.4.8"
          cabal-version: "3.12.1.0"

      - name: Set up mise tools
        uses: jdx/mise-action@v3
        env:
          POSTGRES_CONFIGURE_OPTIONS: "--with-openssl --with-zlib --without-readline --without-icu"

      - name: Update package index
        run: cabal update

      - name: Test
        run: mise exec -- cabal test all

      - name: Build executable
        run: mise exec -- cabal build exe:hauth

      - name: Package executable
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          target="hauth-${tag}-linux-x86_64"
          mkdir -p dist/release
          cp "$(mise exec -- cabal list-bin exe:hauth)" "dist/release/${target}"
          chmod +x "dist/release/${target}"
          tar -C dist/release -czf "dist/release/${target}.tar.gz" "${target}"
          cd dist/release
          sha256sum "${target}.tar.gz" > "${target}.tar.gz.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.tar.gz
            dist/release/*.sha256
