name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.4.8"
          cabal-version: "3.12.1.0"

      - name: Set up mise tools
        uses: jdx/mise-action@v3

      - name: Add Cabal executables to PATH
        run: echo "$HOME/.cabal/bin" >> "$GITHUB_PATH"

      - name: Install check tools
        run: |
          cabal update
          cabal install --overwrite-policy=always fourmolu-0.15.0.0 hlint-3.8

      - name: Check formatting
        run: fourmolu --mode check app src test

      - name: Lint
        run: hlint app src test

      - name: Build
        run: mise exec -- cabal build all

      - name: Test
        run: mise exec -- cabal test all
