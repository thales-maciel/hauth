name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fourmolu
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -L -o "$HOME/.local/bin/fourmolu" \
            https://github.com/fourmolu/fourmolu/releases/download/v0.15.0.0/fourmolu-0.15.0.0-linux-x86_64
          chmod +x "$HOME/.local/bin/fourmolu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: fourmolu --mode check app src test

      - name: Set up hlint
        uses: haskell-actions/hlint-setup@v2
        with:
          version: "3.8"

      - name: Lint
        uses: haskell-actions/hlint-run@v2
        with:
          path: '["app/", "src/", "test/"]'
          fail-on: warning

  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haskell
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.4.8"
          cabal-version: "3.12.1.0"

      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Cache cabal store
        # Only the dep store is cached; dist-newstyle is intentionally excluded. GHC's TH addDependentFile tracking uses content hashes, not mtimes, so a cached library .hi file does not know about newly-added files-embed inputs (e.g. new migrations) and silently reuses stale embeds. Rebuilding the local library from scratch each run is ~30s; the deps store is the real win.
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc9.4.8-store-${{ hashFiles('**/*.cabal', 'cabal.project', 'cabal.project.ci') }}
          restore-keys: |
            ${{ runner.os }}-ghc9.4.8-store-

      - name: Update package index
        run: cabal update

      - name: Build dependencies
        run: cabal build all --only-dependencies --project-file=cabal.project.ci

      - name: Build
        run: cabal build all --project-file=cabal.project.ci

      - name: Test
        run: cabal test all --project-file=cabal.project.ci --enable-coverage

      - name: Collect coverage report
        run: |
          set -euo pipefail
          src=$(find dist-newstyle -type d -path '*hpc/vanilla/html' | head -n 1)
          if [ -z "$src" ]; then
            echo "no HPC HTML report found" >&2
            exit 1
          fi
          mkdir -p coverage-report
          cp -r "$src"/. coverage-report/

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14
