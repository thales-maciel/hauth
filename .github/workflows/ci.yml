name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fourmolu
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -L -o "$HOME/.local/bin/fourmolu" \
            https://github.com/fourmolu/fourmolu/releases/download/v0.15.0.0/fourmolu-0.15.0.0-linux-x86_64
          chmod +x "$HOME/.local/bin/fourmolu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: fourmolu --mode check app src test

      - name: Set up hlint
        uses: haskell-actions/hlint-setup@v2
        with:
          version: "3.8"

      - name: Lint
        uses: haskell-actions/hlint-run@v2
        with:
          path: '["app/", "src/", "test/"]'
          fail-on: warning

  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haskell
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.4.8"
          cabal-version: "3.12.1.0"

      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Cache cabal store and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc9.4.8-${{ hashFiles('**/*.cabal', 'cabal.project', 'cabal.project.ci', 'migrations/**/*.sql', 'templates/**') }}
          restore-keys: |
            ${{ runner.os }}-ghc9.4.8-

      - name: Refresh source mtimes
        # Cache restore stamps dist-newstyle artifacts newer than checked-out sources, defeating GHC's TH addDependentFile tracking on changed embedded files.
        run: find migrations templates src app test -type f -exec touch {} + 2>/dev/null || true

      - name: Update package index
        run: cabal update

      - name: Build dependencies
        run: cabal build all --only-dependencies --project-file=cabal.project.ci

      - name: Build
        run: cabal build all --project-file=cabal.project.ci

      - name: Test
        run: cabal test all --project-file=cabal.project.ci
