name: Docs

# Docs-only PRs are excluded from the main CI workflow via paths-ignore
# (see .github/workflows/ci.yml). This workflow gives them at least a
# cheap validation pass so operator-facing markdown can't ship totally
# unchecked.

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject unresolved conflict markers
        # Same scan the main CI workflow runs; included here so docs-only
        # PRs (which skip the main workflow) still catch this.
        run: |
          if grep -rnE '^(<<<<<<<|>>>>>>>) ' docs README.md 2>/dev/null; then
            echo "::error::Unresolved conflict markers found." >&2
            exit 1
          fi

      - name: Reject contradictory current-version claims
        # Issue #164: README.md, docs/PRODUCTION.md, and the compatibility
        # contract must agree on which milestone is "current". The contract
        # file is named v0.1-compatibility.md for backlink stability, but
        # the surface it describes is also part of the current release.
        # This guard catches the specific regressions we already had:
        #   * README claiming the "v0.X surface" for a milestone that
        #     PRODUCTION.md treats as past or future.
        #   * PRODUCTION.md describing "current behavior" against a
        #     milestone other than the one README labels current.
        run: |
          set -eu
          missing=0
          # README must explicitly name the current surface as v0.2.
          if ! grep -qE 'current v0\.2 surface' README.md; then
            echo "::error file=README.md::expected the phrase 'current v0.2 surface' (issue #164)." >&2
            missing=1
          fi
          # README must not still claim "the v0.1 surface" as the active milestone.
          if grep -nE 'the v0\.1 surface' README.md; then
            echo "::error file=README.md::stale claim 'the v0.1 surface' detected; current is v0.2 (issue #164)." >&2
            missing=1
          fi
          # PRODUCTION.md must keep its v0.2 framing for the current release.
          if ! grep -qE 'Not Covered in v0\.2' docs/PRODUCTION.md; then
            echo "::error file=docs/PRODUCTION.md::expected the section 'What Is Not Covered in v0.2' (issue #164)." >&2
            missing=1
          fi
          # The compat contract file must carry the scope banner clarifying
          # it documents the v0.1-introduced contract still upheld in v0.2.
          if ! grep -qE 'still upholds in the current v0\.2 release' docs/v0.1-compatibility.md; then
            echo "::error file=docs/v0.1-compatibility.md::missing scope banner tying the v0.1 contract to the current v0.2 release (issue #164)." >&2
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          # `--no-progress` keeps the log tidy in CI. `--accept` whitelists
          # plain redirects (3xx) that some sites use for canonical URLs.
          args: >-
            --no-progress
            --accept 200,204,206,301,302,308,403,429
            --max-concurrency 8
            './docs/**/*.md'
            './README.md'
          fail: true

  cli-smoke-test:
    name: CLI smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haskell
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.4.8"
          cabal-version: "3.12.1.0"

      - name: Cache cabal store
        # Only the dep store is cached; dist-newstyle is intentionally excluded.
        # See ci.yml for details on why the local build is excluded.
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc9.4.8-store-${{ hashFiles('**/*.cabal', 'cabal.project', 'cabal.project.ci') }}
          restore-keys: |
            ${{ runner.os }}-ghc9.4.8-store-

      - name: Update package index
        run: cabal update

      - name: Build dependencies
        run: cabal build all --only-dependencies --project-file=cabal.project.ci

      - name: Build hauth executable
        # Fast build for smoke test: optimization level 0 (set in cabal.project.ci)
        run: cabal build exe:hauth --project-file=cabal.project.ci

      - name: Smoke test: hauth --help
        run: |
          cabal exec exe:hauth -- --help

      - name: Smoke test: hauth serve --help
        run: |
          cabal exec exe:hauth -- serve --help

      - name: Smoke test: hauth migrate --help
        run: |
          cabal exec exe:hauth -- migrate --help

      - name: Smoke test: hauth verify --help
        run: |
          cabal exec exe:hauth -- verify --help

      - name: Extract supported subcommands from binary
        id: subcommands
        run: |
          # Run `hauth --help` and extract the subcommand names from the "Commands:" section.
          # Formats to handle: "  serve       Start the Hauth HTTP server"
          subcommands=$(cabal exec exe:hauth -- --help | awk '/^Commands:/{flag=1; next} /^Run/{flag=0} flag && /^  [a-z]/ {print $1}' | sort)
          echo "Extracted subcommands:"
          echo "$subcommands"
          echo "subcommands<<EOF" >> $GITHUB_OUTPUT
          echo "$subcommands" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Guard docs mention only supported subcommands
        run: |
          set -eu
          subcommands='${{ steps.subcommands.outputs.subcommands }}'

          # Build a regex pattern of supported subcommands
          pattern=$(echo "$subcommands" | paste -sd '|' - | sed 's/^/(/; s/$/)/')

          echo "Checking that docs only mention supported subcommands: $pattern"

          # Search for 'hauth <subcommand>' patterns in docs and README
          found_unknown=0
          while IFS= read -r line; do
            # Extract the subcommand following 'hauth '
            if [[ $line =~ hauth[[:space:]]+([a-z_-]+) ]]; then
              cmd="${BASH_REMATCH[1]}"
              # Skip if it's help or hyphenated options
              if [[ "$cmd" == "-"* ]] || [[ "$cmd" == "help" ]]; then
                continue
              fi
              # Check if this subcommand is in the supported list
              if ! echo "$subcommands" | grep -q "^$cmd\$"; then
                echo "::error::Unsupported subcommand referenced in docs: '$cmd' (from: $line)"
                found_unknown=1
              fi
            fi
          done < <(grep -rh "hauth " docs/ README.md 2>/dev/null || true)

          if [ "$found_unknown" -eq 1 ]; then
            exit 1
          fi

          echo "All documented subcommands are supported by the binary."
